# La fiecare push pe main: teste pe Windows, build .exe cu ffmpeg inclus, release nou pentru descarcare
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ffmpeg (build LGPL)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item ff/*/bin/ffmpeg.exe, ff/*/bin/ffprobe.exe ffmpeg/
          Copy-Item ff/*/LICENSE.txt ffmpeg/LICENSE-ffmpeg.txt

      - name: Dependinte
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Teste
        run: python teste/test_aplicatie.py

      - name: Build
        shell: pwsh
        run: |
          python main.py --icon icon.png
          pyinstaller --noconfirm --windowed --name SeparareClipuri --icon icon.png `
            --add-data "AJUTOR.md:." --add-binary "ffmpeg/ffmpeg.exe:ffmpeg" --add-binary "ffmpeg/ffprobe.exe:ffmpeg" `
            --add-data "ffmpeg/LICENSE-ffmpeg.txt:ffmpeg" main.py

      - name: Verificare .exe
        shell: pwsh
        run: |
          $p = Start-Process dist/SeparareClipuri/SeparareClipuri.exe -ArgumentList '--verificare' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "verificarea a esuat: $($p.ExitCode)" }

      - name: Arhiva
        shell: pwsh
        run: Compress-Archive dist/SeparareClipuri SeparareClipuri-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SeparareClipuri-Windows
          path: SeparareClipuri-Windows.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Separare Clipuri 1.${{ github.run_number }}
          make_latest: true
          files: SeparareClipuri-Windows.zip
          body_path: INSTALARE-WINDOWS.md
